<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Practical Tasks Solution</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .part-title {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      margin-top: 30px;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-left: 5px solid #3498db;
      border-radius: 6px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }
    .card-header {
      font-weight: bold;
      color: #2c3e50;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .card-body {
      flex-grow: 1;
      font-size: 0.95rem;
      word-break: break-word;
    }
    /* Simple Table styles for output */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 6px 8px;
    }
    th {
      background-color: #f2f2f2;
      color: #333;
    }
    .code-text {
      background-color: #f8f9fa;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: monospace;
      display: inline-block;
    }
    .warn-text {
      color: #d35400;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>JavaScript Practical Tasks Output Dashboard</h1>

  <!-- Part 1 -->
  <div class="part-title">Part 1: Array Higher-Order Methods</div>
  <div class="grid-container" id="part1"></div>

  <!-- Part 2 -->
  <div class="part-title">Part 2: String Methods</div>
  <div class="grid-container" id="part2"></div>

  <!-- Part 3 -->
  <div class="part-title">Part 3: Date Methods</div>
  <div class="grid-container" id="part3"></div>

  <!-- Part 4 -->
  <div class="part-title">Part 4: Asynchronous JavaScript</div>
  <div class="grid-container" id="part4"></div>

  <!-- Part 5 -->
  <div class="part-title">Part 5: Promises and API Fetching</div>
  <div class="grid-container" id="part5"></div>

  <!-- Part 6 -->
  <div class="part-title">Part 6: Real-Time Mini Tasks</div>
  <div class="grid-container" id="part6"></div>

  <script src="scrpit.js"></script>
</body>
</html>
